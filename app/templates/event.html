{% extends "base.html" %}
{% block title %}Request inspector{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <a href="/events" class="back">Security events</a>
    <h2>Request inspector</h2>
    <p>Everything the firewall saw and decided for <span class="mono">{{ event_id }}</span>, layer by layer</p>
  </div>
</div>
<div id="inspector" class="stack" data-event-id="{{ event_id }}"><span class="spinner"></span></div>
{% endblock %}
{% block scripts %}<script src="{{ asset('js/event.js') }}"></script>{% endblock %}
